# An Ingress for the web Deployment in app.yaml, routed by hostname on its own floating IP.
# The add-on's Ingress backend must be a NodePort (or LoadBalancer) Service, not ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: netactuate # required: without it the Ingress never gets an address
  rules:
    - host: web.example.com # your hostname; point its DNS at the Ingress address
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-nodeport
                port:
                  number: 80
