# A two-replica nginx Deployment exposed on a public floating IP by the VPC load balancer add-on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  loadBalancerClass: netactuate.com/vpc-lb # required: without it the Service stays <pending>
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
